# Oura Partner Dashboard — Cloudflare Worker config
name = "oura-partner-dashboard"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Security requirement: the only way in is the Access-protected custom domain.
workers_dev = false

# Custom domain on the joshuawalulik.com zone. Deploying creates the DNS
# record and TLS certificate automatically. NOTE: this must stay above the
# first [table] header — TOML assigns later bare keys to the open table, so
# below [observability] it would silently become observability.routes.
routes = [
  { pattern = "oura.joshuawalulik.com", custom_domain = true }
]

# Persist structured console logs to Workers Logs (dashboard: Workers → Logs).
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# All requests (including static assets) go through the Worker so the
# Access JWT is validated and security headers are applied on every response.
run_worker_first = true

[[kv_namespaces]]
binding = "OURA_KV"
id = "fb9c60d3753b4c0caf75f0965aa1b70c"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   OURA_CLIENT_ID, OURA_CLIENT_SECRET, CF_ACCESS_AUD, CF_ACCESS_TEAM_DOMAIN, OWNER_EMAIL

# ---- Public demo: `npx wrangler deploy --env demo` ----
# Same code, synthetic data (src/demo.ts). Deliberately NO Access in front
# and nothing private behind: no KV namespace, no secrets, no OAuth routes.
# Wrangler environments don't inherit routes/vars/kv, which is exactly the
# point — the demo Worker can't reach production's KV even by mistake.
[env.demo]
routes = [
  { pattern = "oura-demo.joshuawalulik.com", custom_domain = true }
]

[env.demo.vars]
DEMO_MODE = "1"

[env.demo.observability]
enabled = true

[env.demo.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
