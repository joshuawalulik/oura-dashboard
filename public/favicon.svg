  <g stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round">
    <line x1="13.6" y1="50.4" x2="16.4" y2="47.6"/>
    <line x1="6" y1="32" x2="10" y2="32"/>
    <line x1="13.6" y1="13.6" x2="16.4" y2="16.4"/>
    <line x1="32" y1="6" x2="32" y2="10"/>
    <line x1="50.4" y1="13.6" x2="47.6" y2="16.4"/>
    <line x1="58" y1="32" x2="54" y2="32"/>
    <line x1="50.4" y1="50.4" x2="47.6" y2="47.6"/>
