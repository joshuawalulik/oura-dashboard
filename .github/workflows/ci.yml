name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A newer push cancels the previous still-running run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & deploy
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: this workflow holds the Cloudflare
      # deploy token, and a mutable tag is a supply-chain risk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run

      # Deploy steps run only on pushes to main; tests above gate them.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stamp the deploy with its commit so the footer shows the build.
          command: deploy --var GIT_SHA:${{ github.sha }}
      - name: Smoke test — site is up and fails closed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://oura.joshuawalulik.com/)
          echo "GET / -> $code"
          # Unauthenticated requests must be redirected to Access (302) or
          # rejected by the Worker (403). Anything else fails the run.
          if [ "$code" != "302" ] && [ "$code" != "403" ]; then
            echo "Unexpected status — site may be open or down" >&2
            exit 1
          fi

      # The public demo (synthetic data, no auth, no KV/secrets) deploys as
      # its own Worker; it only ships after production deployed cleanly.
      - name: Deploy demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env demo --var GIT_SHA:${{ github.sha }}
      - name: Smoke test — demo is up and serving synthetic data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          body=$(curl -s -m 20 https://oura-demo.joshuawalulik.com/api/status)
          echo "GET /api/status -> $body"
          # The demo must answer without auth AND declare itself a demo.
          echo "$body" | grep -q '"demo":true' || {
            echo "Demo is down or not serving synthetic data" >&2
            exit 1
          }
