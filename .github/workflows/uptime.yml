name: Uptime

# Hourly probe: the site must be reachable AND failing closed. GitHub emails
# the repo owner when a scheduled run fails.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe site
        run: |
          code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" https://oura.joshuawalulik.com/)
          echo "GET / -> $code"
          # Unauthenticated requests must be redirected to Access (302) or
          # rejected by the Worker (403). Anything else is an incident:
          # 5xx/timeout = down; 200 = the front door is OPEN.
          if [ "$code" != "302" ] && [ "$code" != "403" ]; then
            echo "Unexpected status $code" >&2
            exit 1
          fi
      - name: Probe demo
        run: |
          # The demo is the public face of the project: it must be up and
          # must still be the synthetic-data Worker, never anything else.
          # Retried so a transient DNS/edge hiccup doesn't page as an outage.
          for attempt in 1 2 3; do
            body=$(curl -s -m 20 https://oura-demo.joshuawalulik.com/api/status) || body=""
            echo "attempt $attempt: GET /api/status -> $body"
            if echo "$body" | grep -q '"demo":true'; then
              exit 0
            fi
            sleep 20
          done
          echo "Demo is down or not serving synthetic data" >&2
          exit 1
